<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Tickey! - Tic Tac Toe</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <script src="https://cdn.tailwindcss.com"></script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0"
  }
}
</script>
    <style>
      :root {
        --color-background: #0f172a;
        --color-text-primary: #e2e8f0;
        --color-text-secondary: #94a3b8;
        --color-player-x: #22d3ee;
        --color-player-o: #facc15;
        --color-accent: #7c3aed;
        --color-accent-hover: #6d28d9;
        --color-board-bg: #1f2937;
        --color-square-bg: #0f172a;
        --color-square-hover: #374151;
        --color-win-bg: #16a34a;
        --color-gradient-from: #22d3ee;
        --color-gradient-to: #8b5cf6;
        --board-gap: 12px;
        --board-grid-color: var(--color-board-bg);
      }

      * {
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }

      /* Global Bold Animated Scrollbar */
      ::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      ::-webkit-scrollbar-track {
        background: var(--color-square-bg);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(
          to bottom,
          var(--color-gradient-from),
          var(--color-gradient-to)
        );
        border-radius: 10px;
        border: 3px solid var(--color-square-bg);
        transition: filter 0.3s ease;
      }

      ::-webkit-scrollbar-thumb:hover {
        filter: brightness(1.3) saturate(1.2);
        border-width: 2px;
      }

      /* For Firefox */
      * {
        scrollbar-width: auto;
        scrollbar-color: var(--color-gradient-from) var(--color-square-bg);
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-fade-in {
        animation: fadeIn 0.5s ease-out forwards;
      }
      
      @keyframes fadeOut {
        from { opacity: 1; transform: translateY(0); }
        to { opacity: 0; transform: translateY(10px); }
      }
      .animate-fade-out {
        animation: fadeOut 0.3s ease-in forwards;
      }

      @keyframes pop-in {
        0% { transform: scale(0.5); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); opacity: 1; }
      }
      .animate-pop-in {
        animation: pop-in 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
      }

      @keyframes logo-trigger-anim {
        0% { transform: scale(1) rotate(0deg); }
        25% { transform: scale(1.2) rotate(-10deg); }
        50% { transform: scale(1.1) rotate(10deg); }
        75% { transform: scale(1.15) rotate(-5deg); }
        100% { transform: scale(1) rotate(0deg); }
      }
      .animate-logo-trigger {
        animation: logo-trigger-anim 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      }

      @keyframes jelly {
        0% { transform: scale(1, 1); }
        30% { transform: scale(1.25, 0.75); }
        40% { transform: scale(0.75, 1.25); }
        50% { transform: scale(1.15, 0.85); }
        65% { transform: scale(0.95, 1.05); }
        75% { transform: scale(1.05, 0.95); }
        100% { transform: scale(1, 1); }
      }
      .animate-jelly {
        animation: jelly 0.6s both;
      }

      @keyframes wiggle {
        0%, 100% { transform: rotate(-3deg); }
        50% { transform: rotate(3deg); }
      }
      .animate-wiggle {
        display: inline-block;
        animation: wiggle 0.3s ease-in-out infinite;
      }

      @keyframes slide-in-fade {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .animate-slide-in-fade {
        animation: slide-in-fade 0.4s ease-out forwards;
      }

      @keyframes win-glow {
        0% { transform: scale(1); box-shadow: 0 0 8px var(--color-win-bg); background-color: var(--color-win-bg); }
        50% { transform: scale(1.08); box-shadow: 0 0 40px 15px var(--color-win-bg); background-color: var(--color-win-bg); }
        100% { transform: scale(1); box-shadow: 0 0 8px var(--color-win-bg); background-color: var(--color-win-bg); }
      }
      .animate-win {
        animation: win-glow 1s infinite ease-in-out;
      }

      @keyframes result-bounce {
        0% { transform: scale(0.3); opacity: 0; }
        50% { transform: scale(1.1); opacity: 1; }
        70% { transform: scale(0.9); }
        100% { transform: scale(1); }
      }
      .animate-result-pop {
        animation: result-bounce 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
      }

      @keyframes suggest-glow {
        0%, 100% { box-shadow: 0 0 8px var(--color-accent); transform: scale(1); }
        50% { box-shadow: 0 0 24px 8px var(--color-accent); transform: scale(1.05); }
      }
      .animate-suggest {
        animation: suggest-glow 1.5s infinite ease-in-out;
      }

      @keyframes head-shake {
        0% { transform: translateX(0); }
        25% { transform: translateX(-5px); }
        50% { transform: translateX(5px); }
        75% { transform: translateX(-5px); }
        100% { transform: translateX(0); }
      }
      .animate-head-shake {
        animation: head-shake 0.4s ease-in-out;
      }

      /* Full-screen Language Menu Styles */
      .lang-menu-fullscreen {
        position: absolute;
        inset: 0;
        background-color: var(--color-board-bg);
        z-index: 60;
        display: flex;
        flex-direction: column;
        padding: 2rem;
        animation: fadeIn 0.2s ease-out;
        overflow-y: auto;
      }

      .lang-menu-close-button {
        position: absolute;
        top: 1.25rem;
        right: 1.25rem;
        padding: 0.25rem;
        border-radius: 9999px;
        color: var(--color-text-secondary);
        transition: color 0.2s, background-color 0.2s;
      }
      .lang-menu-close-button:hover {
        background-color: var(--color-square-hover);
        color: var(--color-text-primary);
      }
      
      .lang-menu-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 1rem;
        margin-top: 2rem;
        width: 100%;
      }
      
      .lang-menu-button {
        padding: 1rem 0.5rem;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: all 0.2s;
        text-align: center;
        background-color: var(--color-square-hover);
        color: var(--color-text-secondary);
        border: 2px solid transparent;
      }
      .lang-menu-button:hover {
        background-color: var(--color-accent);
        color: white;
        transform: translateY(-2px);
      }
      .lang-menu-button--active {
        background-color: var(--color-accent);
        color: white;
        border-color: var(--color-gradient-from);
      }
    </style>
  <link rel="stylesheet" href="/index.css">
</head>
  <body class="bg-slate-900 overscroll-none">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
